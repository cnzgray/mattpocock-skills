<text class="t" x="376" y="226">File it (record only, no action)</text>
<text class="s" x="376" y="252">Say: “file a request / bug: &lt;their words&gt;”</text>
<text class="s" x="376" y="274">Lands in: issue file · Status: needs-triage</text>
<text class="s" x="376" y="296">I reply: filed NN, nothing else</text>
<rect class="side" x="690" y="200" width="290" height="112" rx="10"/>
