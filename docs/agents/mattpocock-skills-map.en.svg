<text class="s" x="1036" y="274">Unclear → needs-info: send /to-questionnaire to the reporter, triage on reply</text>
<text class="s" x="1036" y="296">Clear → follow the request / bug flow below; won't do → close as wontfix</text>
<rect class="manual" x="1576" y="211" width="54" height="20" rx="12"/><text class="bt" x="1603" y="225" text-anchor="middle">manual</text>
