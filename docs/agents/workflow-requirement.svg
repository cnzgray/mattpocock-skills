<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" width="1000" height="1160"><style>
.bg{fill:#f8fafc} .band{fill:#eef2f7} .bl{font:600 14px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#475569}
.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.2} .key{stroke:#1e40af;stroke-width:1.8}
.side{fill:#fff;stroke:#94a3b8;stroke-width:1.1;stroke-dasharray:5 4} .io{fill:#e2e8f0}
.done{fill:#ecfdf5;stroke:#059669;stroke-width:1.4}
.t{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a} .s{font:400 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#475569}
.manual{fill:#1e40af} .auto{fill:#059669} .bt{font:600 11px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff}
.edge{stroke:#64748b;stroke-width:1.4;fill:none} .dash{stroke-dasharray:5 4}
.lbl{font:500 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334155} .arrow{fill:#64748b} .dia{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}
.h1{font:700 20px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
@media (prefers-color-scheme: dark){
 .bg{fill:#0f172a} .band{fill:#1e293b} .bl{fill:#94a3b8}
 .node,.side{fill:#0b1220;stroke:#475569} .key{stroke:#60a5fa} .io{fill:#334155}
 .done{fill:#052e25;stroke:#34d399} .dia{fill:#2a1608;stroke:#fb923c}
 .t,.h1{fill:#f8fafc} .s,.lbl{fill:#cbd5e1} .edge{stroke:#94a3b8} .arrow{fill:#94a3b8}
 .manual{fill:#2563eb}
}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1000" height="1160"/>
<text class="h1" x="20" y="34">需求流程：登记 → 分析（spec）→ 实现（工单）</text>
<rect class="band" x="12" y="112" width="976" height="134" rx="12"/>
<text class="bl" x="32" y="184.0">登记</text>
<rect class="band" x="12" y="252" width="976" height="490" rx="12"/>
<text class="bl" x="32" y="502.0">分析</text>
<rect class="band" x="12" y="748" width="976" height="340" rx="12"/>
<text class="bl" x="32" y="923.0">实现</text>
<rect class="io" x="220" y="52" width="360" height="46" rx="10"/>
<text class="t" x="400.0" y="80.0" text-anchor="middle">客户反馈 / 需求原话</text>
<path class="edge" d="M400.0,98 V132" marker-end="url(#a)"/>
<rect class="node key" x="220" y="136" width="360" height="104" rx="10"/>
<text class="t" x="236" y="163">登记到工单系统</text>
<text class="s" x="236" y="185">方式：对我说「登记一条需求」，或手写文件</text>
<text class="s" x="236" y="205">落点：.scratch/&lt;feature&gt;/issues/NN-&lt;slug&gt;.md</text>
<text class="s" x="236" y="225">内容：客户原话 + 日期 + 来源 · Category: enhancement</text>
<rect class="side" x="640" y="136" width="330" height="104" rx="10"/>
<text class="t" x="656" y="163">没有专门的 skill</text>
<text class="s" x="656" y="185">按 docs/agents/issue-tracker.md「新建」</text>
<text class="s" x="656" y="205">初始 Status: needs-triage</text>
<text class="s" x="656" y="225">/to-tickets 拆出的工单不走登记与分诊</text>
<path class="edge dash" d="M580,188 H636" marker-end="url(#a)"/>
<g transform="translate(0,40)">
<path class="edge" d="M400.0,200 V256" marker-end="url(#a)"/>
<rect class="node key" x="220" y="260" width="360" height="76" rx="10"/>
<text class="t" x="236" y="287">/triage</text>
<text class="s" x="236" y="309">归类 · 查是否已实现 · 定去向</text>
<rect class="manual" x="526" y="271" width="42" height="20" rx="10"/>
<text class="bt" x="547" y="285" text-anchor="middle">手动</text>
<rect class="side" x="640" y="218" width="330" height="54" rx="10"/>
<text class="t" x="656" y="245">已实现 → wontfix</text>
<text class="s" x="656" y="267">指出代码位置，关闭</text>
<path class="edge dash" d="M580,298 H610 V245 H636" marker-end="url(#a)"/>
<rect class="side" x="640" y="280" width="330" height="54" rx="10"/>
<text class="t" x="656" y="307">拒绝 → wontfix</text>
<text class="s" x="656" y="329">理由记入 .out-of-scope/</text>
<path class="edge dash" d="M580,298 H610 V307 H636" marker-end="url(#a)"/>
<rect class="side" x="640" y="342" width="330" height="54" rx="10"/>
<text class="t" x="656" y="369">信息不足 → needs-info</text>
<text class="s" x="656" y="391">/to-questionnaire 问客户，回复后重回 triage</text>
<path class="edge dash" d="M580,298 H610 V369 H636" marker-end="url(#a)"/>
<rect class="side" x="640" y="404" width="330" height="54" rx="10"/>
<text class="t" x="656" y="431">需求过大</text>
<text class="s" x="656" y="453">/wayfinder 先拆成决策工单</text>
<path class="edge dash" d="M580,298 H610 V431 H636" marker-end="url(#a)"/>
<path class="edge" d="M400.0,336 V496" marker-end="url(#a)"/>
<text class="lbl" x="410.0" y="420" text-anchor="start">需要实现</text>
<rect class="node key" x="220" y="500" width="360" height="72" rx="10"/>
<text class="t" x="236" y="527">/grill-with-docs</text>
<text class="s" x="236" y="549">逐轮追问，把方案问清楚</text>
<rect class="manual" x="526" y="511" width="42" height="20" rx="10"/>
<text class="bt" x="547" y="525" text-anchor="middle">手动</text>
<rect class="side" x="640" y="478" width="330" height="54" rx="10"/>
<text class="t" x="656" y="505">GLOSSARY.md · docs/adr/</text>
<text class="s" x="656" y="527">术语与决策当场落盘</text>
<rect class="side" x="640" y="542" width="330" height="54" rx="10"/>
<text class="t" x="656" y="569">prototype · research</text>
<text class="s" x="656" y="591">一次性原型验证 / 查一手资料</text>
<rect class="auto" x="916" y="553" width="42" height="20" rx="10"/>
<text class="bt" x="937" y="567" text-anchor="middle">自动</text>
<path class="edge dash" d="M580,536 H610 V505 H636" marker-end="url(#a)"/>
<path class="edge dash" d="M580,536 H610 V569 H636" marker-end="url(#a)"/>
<path class="edge" d="M400.0,572 V616" marker-end="url(#a)"/>
<rect class="node key" x="220" y="620" width="360" height="64" rx="10"/>
<text class="t" x="236" y="647">/to-spec</text>
<text class="s" x="236" y="669">整理成 spec · 打 ready-for-agent</text>
<rect class="manual" x="526" y="631" width="42" height="20" rx="10"/>
<text class="bt" x="547" y="645" text-anchor="middle">手动</text>
<path class="edge" d="M400.0,684 V720" marker-end="url(#a)"/>
<rect class="node key" x="220" y="724" width="360" height="64" rx="10"/>
<text class="t" x="236" y="751">/to-tickets</text>
<text class="s" x="236" y="773">拆垂直切片 + 阻塞关系 · 你确认后发布</text>
<rect class="manual" x="526" y="735" width="42" height="20" rx="10"/>
<text class="bt" x="547" y="749" text-anchor="middle">手动</text>
<path class="edge" d="M400.0,788 V832" marker-end="url(#a)"/>
<rect class="node key" x="220" y="836" width="360" height="92" rx="10"/>
<text class="t" x="236" y="863">/implement &lt;工单&gt;</text>
<text class="s" x="236" y="885">tdd 写 → code-review 自审 → commit</text>
<text class="s" x="236" y="905">做完一张 /clear，再取下一张可开工的</text>
<rect class="manual" x="526" y="847" width="42" height="20" rx="10"/>
<text class="bt" x="547" y="861" text-anchor="middle">手动</text>
<rect class="side" x="640" y="836" width="330" height="92" rx="10"/>
<text class="t" x="656" y="863">/implement-spec</text>
<text class="s" x="656" y="885">整包并行：多子 agent + worktree</text>
<text class="s" x="656" y="905">需先把 merge 改为 rebase + ff</text>
<rect class="manual" x="916" y="847" width="42" height="20" rx="10"/>
<text class="bt" x="937" y="861" text-anchor="middle">手动</text>
<path class="edge dash" d="M580,756 H610 V882 H636" marker-end="url(#a)"/>
<text class="lbl" x="616" y="820" text-anchor="start">或</text>
<path class="edge" d="M400.0,928 V976" marker-end="url(#a)"/>
<rect class="done" x="220" y="980" width="750" height="52" rx="10"/>
<text class="t" x="595.0" y="1011.0" text-anchor="middle">完成：关闭工单 · 删除 .scratch/&lt;feature&gt;/（历史留在 git）</text>
</g>
<rect class="manual" x="32" y="1114" width="42" height="20" rx="10"/><text class="bt" x="53" y="1128" text-anchor="middle">手动</text>
<text class="lbl" x="84" y="1129" text-anchor="start">只能由你输入斜杠命令</text>
<rect class="auto" x="252" y="1114" width="42" height="20" rx="10"/><text class="bt" x="273" y="1128" text-anchor="middle">自动</text>
<text class="lbl" x="304" y="1129" text-anchor="start">我按场景自动调用</text>
<path class="edge dash" d="M450,1124 H500"/>
<text class="lbl" x="510" y="1129" text-anchor="start">旁支 / 可选 / 产出物</text></svg>
